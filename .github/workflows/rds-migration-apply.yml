name: Apply RDS Migrations

# Event-driven: runs automatically when a migration file is pushed to main,
# instead of database-query.yml's manual workflow_dispatch. Applies to "qa"
# first; "prod" only runs after qa succeeds and (via the "prod" GitHub
# Environment's required-reviewer protection rule, configured in repo
# Settings -> Environments, not here) someone approves the deployment.
on:
  push:
    branches: [main]
    paths:
      - "migrations/**.sql"

permissions:
  contents: read

jobs:
  apply-qa:
    runs-on: ubuntu-latest
    name: Apply to qa
    environment: qa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed migration files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" -- 'migrations/*.sql')
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'migrations/*.sql')
          fi
          FILES=$(echo "$FILES" | sort)

          if [ -z "$FILES" ]; then
            echo "No migration files changed in this push -- nothing to apply."
          fi

          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client and Session Manager plugin
        if: steps.changed.outputs.files != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Open SSM tunnel to RDS
        if: steps.changed.outputs.files != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ssm start-session \
            --target "${{ vars.SSM_TARGET_INSTANCE_ID }}" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters '{"host":["${{ secrets.DB_TUNNEL_HOST }}"],"portNumber":["${{ secrets.DB_TUNNEL_PORT }}"],"localPortNumber":["${{ vars.DB_PORT }}"]}' \
            > /tmp/ssm-tunnel.log 2>&1 &

          echo "Waiting for tunnel on 127.0.0.1:${{ vars.DB_PORT }}..."
          for i in $(seq 1 30); do
            if (exec 3<>"/dev/tcp/127.0.0.1/${{ vars.DB_PORT }}") 2>/dev/null; then
              echo "Tunnel is up"
              exit 0
            fi
            sleep 1
          done

          echo "::error::SSM tunnel did not come up in time"
          cat /tmp/ssm-tunnel.log
          exit 1

      - name: Apply migration files via psql
        if: steps.changed.outputs.files != ''
        run: |
          set -e
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "### Applying $f" >> "$GITHUB_STEP_SUMMARY"
            PGPASSWORD="${{ secrets.DB_PASS }}" \
              psql -v ON_ERROR_STOP=1 \
                   -h "${{ vars.DB_HOST }}" \
                   -p "${{ vars.DB_PORT }}" \
                   -U "${{ vars.DB_USER }}" \
                   -d "${{ vars.DB_NAME }}" \
                   -f "$f"
          done <<< "${{ steps.changed.outputs.files }}"

  apply-prod:
    needs: apply-qa
    runs-on: ubuntu-latest
    name: Apply to prod
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed migration files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" -- 'migrations/*.sql')
          else
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'migrations/*.sql')
          fi
          FILES=$(echo "$FILES" | sort)

          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client and Session Manager plugin
        if: steps.changed.outputs.files != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Open SSM tunnel to RDS
        if: steps.changed.outputs.files != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ssm start-session \
            --target "${{ vars.SSM_TARGET_INSTANCE_ID }}" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters '{"host":["${{ secrets.DB_TUNNEL_HOST }}"],"portNumber":["${{ secrets.DB_TUNNEL_PORT }}"],"localPortNumber":["${{ vars.DB_PORT }}"]}' \
            > /tmp/ssm-tunnel.log 2>&1 &

          echo "Waiting for tunnel on 127.0.0.1:${{ vars.DB_PORT }}..."
          for i in $(seq 1 30); do
            if (exec 3<>"/dev/tcp/127.0.0.1/${{ vars.DB_PORT }}") 2>/dev/null; then
              echo "Tunnel is up"
              exit 0
            fi
            sleep 1
          done

          echo "::error::SSM tunnel did not come up in time"
          cat /tmp/ssm-tunnel.log
          exit 1

      - name: Apply migration files via psql
        if: steps.changed.outputs.files != ''
        run: |
          set -e
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "### Applying $f" >> "$GITHUB_STEP_SUMMARY"
            PGPASSWORD="${{ secrets.DB_PASS }}" \
              psql -v ON_ERROR_STOP=1 \
                   -h "${{ vars.DB_HOST }}" \
                   -p "${{ vars.DB_PORT }}" \
                   -U "${{ vars.DB_USER }}" \
                   -d "${{ vars.DB_NAME }}" \
                   -f "$f"
          done <<< "${{ steps.changed.outputs.files }}"
